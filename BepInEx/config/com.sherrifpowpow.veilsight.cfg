## Settings file was created by plugin VeilSight v1.0.1
## Plugin GUID: com.sherrifpowpow.veilsight

[Balance]

## Forgiving uses the validated full delay curve. Standard uses the same curve at 80% duration for faster enemies or harder AI presets.
# Setting type: DifficultyPreset
# Default value: Forgiving
# Acceptable values: Forgiving, Standard
DifficultyPreset = Forgiving

[Diagnostics]

## Writes detailed exposure and visibility decisions to the BepInEx log. Leave disabled for normal play.
# Setting type: Boolean
# Default value: false
DiagnosticsEnabled = false

[Exposure]

## Treats an active visible weapon light as fully exposed. Laser-only modes are ignored.
# Setting type: Boolean
# Default value: true
FlashlightOverride = true

## Maximum exposure reduction from a low stance.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 1
PoseWeight = 0.1

[General]

## Enables VeilSight exposure sampling and visibility-delay behavior.
# Setting type: Boolean
# Default value: true
Enabled = true

## Seconds between exposure samples.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0.25 to 0.5
SampleInterval = 0.35

## Distance in metres at or below which visibility is never delayed.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 0 to 100
CloseRangeBypass = 6

[Meter]

## Shows the exposure meter during a raid.
# Setting type: Boolean
# Default value: true
ShowMeter = true

## Seconds used to smooth meter movement. This affects display only.
# Setting type: Single
# Default value: 0.09
# Acceptable value range: From 0.05 to 1.5
SmoothTime = 0.09

## Exposure meter size multiplier.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 2
Scale = 1

## Horizontal meter position, from left (0) to right (1).
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
PositionX = 0.5

## Vertical meter position, from top (0) to bottom (1).
# Setting type: Single
# Default value: 0.88
# Acceptable value range: From 0 to 1
PositionY = 0.88

