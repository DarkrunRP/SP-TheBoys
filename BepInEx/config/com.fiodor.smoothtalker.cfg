## Settings file was created by plugin SmoothTalker v1.2.1
## Plugin GUID: com.fiodor.smoothtalker

[1. General]

## Master toggle for all voicelines.
# Setting type: Boolean
# Default value: true
Enabled = true

## Minimum seconds between any voiceline to avoid spam.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 30
Cooldown (seconds) = 5

## Only play voicelines (kills, reload, out-of-ammo) when in combat.
## Combat = player fired a shot within the timeout window.
## Grenade throws and shot-at voicelines always play regardless of this setting.
# Setting type: Boolean
# Default value: true
Combat Only = true

## How many seconds after the last shot until the player is considered out of combat.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 60
Combat Timeout (seconds) = 2

## Only play voicelines when at least one other human player is alive.
## Requires Fika to be installed. When Fika is not present this setting has no effect.
# Setting type: Boolean
# Default value: false
Not a schizophrenic = false

