[1. Targeting]

## Who Partizan is allowed to hunt. IncludeAiPmcs: you + AI PMCs (random pick). AiPmcsOnly: only AI PMCs, never you. Vanilla: stock (hunts you only).
# Setting type: PartizanMode
# Default value: IncludeAiPmcs
# Acceptable values: Vanilla, IncludeAiPmcs, AiPmcsOnly
Aggro mode = IncludeAiPmcs

[2. Misc]

## Log every target pick / trigger redirect to the BepInEx console. For troubleshooting only.
# Setting type: Boolean
# Default value: false
Debug logging = false

[3. Roaming]

## Make Partizan prowl the map instead of loitering. Lowers his change-route / stay timers and lets him sprint to patrol points.
# Setting type: Boolean
# Default value: true
Faster roaming = true

## How often he re-routes while roaming (stock is ~9325, i.e. basically never).
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 600
Change route every (sec) = 30

## How long he lingers at a patrol point before moving on (stock 72).
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0 to 120
Max loiter at a point (sec) = 12

[4. Traps]

## Enable his grenade-trap (tripwire) planting. He spawns with grenades by default, so this gives him something to plant.
# Setting type: Boolean
# Default value: true
Plant tripwire traps = true

